spring.application.name=pago
server.port=8030

# --- H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:pagodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Consola H2: http://localhost:8030/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Pasarela de pago ---
# simulada = implementacion local para desarrollo | feign = llama a un proveedor externo en pasarela.url
pasarela.modo=simulada
pasarela.url=http://localhost:9090
pasarela.simulada.monto-maximo=1000000
spring.cloud.openfeign.lazy-attributes-resolution=true
