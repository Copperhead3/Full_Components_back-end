spring.application.name=pago
server.port=8087

# MYSQL - XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/fullcomponents_pago?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PASARELA DE PAGO
pasarela.modo=simulada
pasarela.url=http://localhost:9090
pasarela.simulada.monto-maximo=1000000
spring.cloud.openfeign.lazy-attributes-resolution=true
