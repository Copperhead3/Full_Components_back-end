# =========================================================
# APLICACION
# =========================================================

spring.application.name=pedido
server.port=8085


# =========================================================
# MYSQL - XAMPP
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/fullcomponents_pedido?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =========================================================
# SWAGGER / OPENAPI
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs


# =========================================================
# MICROSERVICIOS
# =========================================================

services.usuarios.url=http://localhost:8080

services.carrito.url=http://localhost:8081

services.producto.url=http://localhost:8082

services.inventario.url=http://localhost:8083

services.despacho.url=http://localhost:8084

services.pago.url=http://localhost:8030


# =========================================================
# OPENFEIGN
# =========================================================

spring.cloud.openfeign.client.config.default.connectTimeout=5000

spring.cloud.openfeign.client.config.default.readTimeout=10000