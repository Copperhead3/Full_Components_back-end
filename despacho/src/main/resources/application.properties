spring.application.name=despacho
# 8081 para no chocar con el microservicio pago (8080)
server.port=8081

# --- H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:despachodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Consola H2: http://localhost:8081/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Reglas de negocio ---
despacho.dias-estimados-domicilio=3
despacho.dias-estimados-retiro=1
