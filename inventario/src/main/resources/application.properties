# MICROSERVICIO
spring.application.name=inventario
server.port=8083

# BASE DE DATOS H2 EN MEMORIA
spring.datasource.url=jdbc:h2:mem:inventario_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CONSOLA H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CONEXIÓN CON PRODUCTO
microservicios.producto.url=http://localhost:8082

# RESERVAS
inventario.reserva-minutos=15
inventario.expiracion-intervalo-ms=60000